<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>比赛投票墙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="vote-wall">

    <!-- 标题行 -->
    <div class="header">
      <h1>
        <span>🗳️</span> 比赛投票墙
      </h1>
      <!-- 修改：徽章文案改为"最高票数" -->
      <div class="total-votes-badge" id="topVotesBadge">
        <i>🏆</i> 最高票数 <span id="topVotesCount">0</span>
      </div>
    </div>

    <!-- 上传作品区域 -->
    <div class="upload-section">
      <div class="upload-label">📤 上传你的参赛作品</div>
      <label class="upload-btn">
        <span>📁</span> 选择图片上传
        <input type="file" id="fileInput" accept="image/*" />
      </label>

      <!-- 上传前预览 -->
      <div class="preview-area" id="previewArea">
        <img id="previewImage" class="preview-image" src="" alt="作品预览" />
        <br />
        <button class="publish-btn" id="publishBtn">🚀 发布作品</button>
        <button class="remove-btn" id="removeBtn">✕ 取消</button>
      </div>
    </div>

    <!-- 作品展示网格 -->
    <div class="works-grid" id="worksGrid">
      <div class="empty-tip" id="emptyTip">
        🎨 还没有作品，快来上传第一个吧！
      </div>
    </div>

  </div>

  <script>
    // ============================================================
    // 1. 数据与 DOM
    // ============================================================
    const fileInput = document.getElementById('fileInput');
    const previewArea = document.getElementById('previewArea');
    const previewImage = document.getElementById('previewImage');
    const publishBtn = document.getElementById('publishBtn');
    const removeBtn = document.getElementById('removeBtn');
    const worksGrid = document.getElementById('worksGrid');
    const emptyTip = document.getElementById('emptyTip');
    const topVotesCount = document.getElementById('topVotesCount');
    const topVotesBadge = document.getElementById('topVotesBadge');

    // 当前待发布的图片
    let pendingImage = null;

    // 作品列表
    const works = [];

    // ============================================================
    // 2. 选择图片 → 显示预览
    // ============================================================
    fileInput.addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('请选择图片文件！');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        pendingImage = e.target.result;
        previewImage.src = pendingImage;
        previewArea.classList.add('active');
      };
      reader.readAsDataURL(file);
    });

    // ============================================================
    // 3. 发布作品
    // ============================================================
    publishBtn.addEventListener('click', function () {
      if (!pendingImage) return;

      const newWork = {
        id: 'work-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        image: pendingImage,
        votes: 0
      };
      works.push(newWork);

      renderWorkCard(newWork);
      updateEmptyTip();
      updateTopVotes();     // 首次发布也要刷新最高票数（虽然 0 票）

      clearPreview();

      setTimeout(() => {
        const card = document.getElementById(newWork.id);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.add('vote-pop');
          setTimeout(() => card.classList.remove('vote-pop'), 400);
        }
      }, 100);
    });

    // ============================================================
    // 4. 取消上传
    // ============================================================
    removeBtn.addEventListener('click', clearPreview);

    function clearPreview() {
      fileInput.value = '';
      pendingImage = null;
      previewImage.src = '';
      previewArea.classList.remove('active');
    }

    // ============================================================
    // 5. 渲染作品卡片
    // ============================================================
    function renderWorkCard(work) {
      const card = document.createElement('div');
      card.className = 'work-card';
      card.id = work.id;

      const img = document.createElement('img');
      img.className = 'work-image';
      img.src = work.image;
      img.alt = '参赛作品';
      card.appendChild(img);

      const votesDiv = document.createElement('div');
      votesDiv.className = 'work-votes';
      votesDiv.id = 'votes-' + work.id;
      votesDiv.innerHTML = `${work.votes} <span class="small-label">票</span>`;
      card.appendChild(votesDiv);

      const voteBtn = document.createElement('button');
      voteBtn.className = 'vote-btn';
      voteBtn.innerHTML = '<span>👍</span> 投一票';
      voteBtn.addEventListener('click', () => handleVote(work.id));
      card.appendChild(voteBtn);

      worksGrid.appendChild(card);
    }

    // ============================================================
    // 6. 投票
    // ============================================================
    function handleVote(workId) {
      const work = works.find(w => w.id === workId);
      if (!work) return;

      work.votes += 1;

      const votesDiv = document.getElementById('votes-' + workId);
      if (votesDiv) {
        votesDiv.innerHTML = `${work.votes} <span class="small-label">票</span>`;
        votesDiv.classList.add('vote-pop');
        setTimeout(() => votesDiv.classList.remove('vote-pop'), 300);
      }

      updateTopVotes();   // 改为更新最高票数
    }

    // ============================================================
    // 7. 【修改】更新最高票数（不再是总票数）
    // ============================================================
    function updateTopVotes() {
      // 没有作品 → 显示 0
      if (works.length === 0) {
        topVotesCount.textContent = '0';
        return;
      }

      // 找出所有作品里的最大票数
      const maxVotes = Math.max(...works.map(w => w.votes));
      topVotesCount.textContent = maxVotes;

      // 徽章动画
      topVotesBadge.classList.add('vote-pop');
      setTimeout(() => topVotesBadge.classList.remove('vote-pop'), 300);
    }

    // ============================================================
    // 8. 空状态控制
    // ============================================================
    function updateEmptyTip() {
      emptyTip.style.display = works.length === 0 ? 'block' : 'none';
    }

    // 初始化
    updateEmptyTip();
  </script>

</body>
</html>
